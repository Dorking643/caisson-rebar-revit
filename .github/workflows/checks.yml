name: Offline checks

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-checks:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-dotnet@v6
        with:
          dotnet-version: '8.0.x'
      - name: Check portable runtime paths and empty-host defaults
        shell: pwsh
        run: dotnet run --project tests/Share1Checks/Share1Checks.csproj -c Release
      - name: Check installer in an isolated directory
        shell: pwsh
        run: ./scripts/Test-Installer.ps1 -WorkDirectory (Join-Path $env:RUNNER_TEMP 'caisson-installer-checks')
